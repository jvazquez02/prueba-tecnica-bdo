<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Incidents</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<main class="container py-4">
    <h1 class="mb-4">Incidents</h1>
    <div class="mb-3">
        <label for="statusFilter" class="form-label">Filter by status</label>
        <select id="statusFilter" class="form-select">
            <option value=""></option>
            <option value="OPEN">Open</option>
            <option value="IN_PROGRESS">In progress</option>
            <option value="CLOSED">Closed</option>
        </select>
    </div>
    <div id="error-message" class="alert alert-danger d-none" role="alert"></div>
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Title</th>
                <th scope="col">Description</th>
                <th scope="col">Priority</th>
                <th scope="col">Status</th>
                <th scope="col">Created</th>
            </tr>
            </thead>
            <tbody id="tableIncidentBody"></tbody>
        </table>
    </div>

    <h2 class="h4 mt-4">Create incident</h2>
    <form id="incidentForm" novalidate>
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" id="title" class="form-control">
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" class="form-control" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label for="priority" class="form-label">Priority</label>
            <select id="priority" class="form-select">
                <option value="">Select a priority</option>
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Create incident</button>
    </form>
    <div id="success-message" class="alert alert-success d-none mt-3" role="status"></div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    const PRE_URL = 'http://localhost:8080'

    $(document).ready(function () {
        loadIncidents();
    });
    
    $(document).on('change', '#statusFilter', loadIncidents);

    $(document).on('submit', '#incidentForm', async function (event) {
        event.preventDefault();
        $('#error-message, #success-message').addClass('d-none');

        const incident = {
            title: $('#title').val(),
            description: $('#description').val(),
            priority: $('#priority').val() || null
        };

        console.log({incident});
        try {
            const response = await fetch(PRE_URL+'/api/incidents/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(incident)
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.message || 'Could not create the incident.');
            }

            this.reset();
            $('#success-message').text('Incident created.').removeClass('d-none');
            await loadIncidents();
        } catch (error) {
            $('#error-message').text(error.message).removeClass('d-none');
        }
    });

    async function loadIncidents() {
        $('#error-message').addClass('d-none');
        $('#tableIncidentBody').empty();

        try {
            const response = await fetch(PRE_URL + '/api/incidents/findAll');
            if (!response.ok) {
                throw new Error(`The API returned ${response.status}.`);
            }

            const allIncidents = await response.json();
            const selectedStatus = $('#statusFilter').val();
            const incidents = selectedStatus
                ? allIncidents.filter(incident => incident.status === selectedStatus)
                : allIncidents;
            if (incidents.length === 0) {
                return;
            }

            incidents.forEach(incident => {
                const $row = $('<tr>');
                [incident.id, incident.title, incident.description, incident.priority,
                    incident.status, incident.dateCreated]
                    .forEach(value => $row.append($('<td>').text(value ?? '')));
                $('#tableIncidentBody').append($row);
            });
        } catch (error) {
            $('#error-message')
                .text('Could not load incidents')
                .removeClass('d-none');
        }
    }
    
</script>
</body>
</html>
